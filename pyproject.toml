[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-adaptive-bot"
version = "0.5.0"
description = "Dynamic Hull 16 MT5 demo scanner and independent Wickless M15 companion"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "pydantic>=2",
  "pyyaml",
  "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
live = ["MetaTrader5"]  # Windows terminal integration; not live-money mode
test = ["pytest"]

[project.scripts]
dynamic-hull = "bot.cli:main"
xauusd-bot = "bot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bot", "bot.config", "bot.hull", "bot.wickless"]
namespaces = false

[tool.setuptools.package-data]
"bot.config" = ["entry_sessions.yaml"]
