# Dynamic Hull 16 • paper observation by default. No credentials belong in this file.
run:
  mode: paper
  market_close_timezone: "Etc/GMT-2"  # verify broker-local maintenance hours
mt5:
  terminal_path: ""                 # blank = current local desktop terminal
safety:
  emergency_flatten_hotkey_file: "KILL"
sessions:                           # additional entry-only blackouts for configured profiles
  maintenance_start: "23:45"
  maintenance_end: "01:05"
  rollover_blackout: {start: "21:55", end: "23:05", tz: UTC}
  trade_only_in: []                 # no extra whitelist; mandatory per-market sessions always apply
  killzones:
    london_open: {start: "07:00", end: "10:00", tz: Europe/London}
    ny_open: {start: "07:00", end: "10:00", tz: America/New_York}
    london_ny_overlap: {start: "13:00", end: "16:00", tz: Europe/London}

# Dynamic Hull and Wickless always load src/bot/config/entry_sessions.yaml for new entries.
# ACTIVE demo entry path. Indicator source = the user's Hull BUY/SELL labels.
hull:
  execution_mode: paired_structure  # both the parent and its own trigger must agree
  eligible_timeframes: [M5, M10, M15]  # native parent -> trigger: 5->3, 10->5, 15->10
  entry_timing: confirmed_cross_next_bar  # entries on fresh post-close quotes only; live crosses still protect
  exit_policy: profit_ladder_70_30_v1  # unchanged: each leg's frozen base + entry spread
  enabled: [XAUUSD]
  magic: 26111825
  indicator:
    hull_len: 16            # shared base period for both Hull curves on every bot lane
    source: dynamic         # bullish: Low; bearish: High. B always uses close.
    neutral_mode: high      # Pine default; still no neutral entries
    structure_timeframe: null  # Pine 'Chart': each signal lane's own native timeframe
    exit_opposite: true     # mandatory raw opposite exit, before entry gates
    exit_on_mss: true  # confirmed shift flattens only its symbol/timeframe
    stop: cross_candle  # completed cross candle low (BUY) / high (SELL), at least one trade tick beyond
    swing_len: 3          # market structure only; not the stop anchor
    atr_length: 14
    atr_buffer: 0.1
    extra_pips: 0
  limits:
    # null disables only these bot-imposed caps; a positive local value opts back in.
    max_positions: null
    max_total_lots: null
    max_open_risk_usd: null
    daily_loss_usd: 0
    min_free_margin_pct: 0  # no extra equity reserve; full batch must still fit estimated free margin
    max_quote_age_s: 4
    max_entry_age_s: 8
  symbols:                # target_usd = base per ticket before adding its entry spread in USD; invalid lots are refused
    XAUUSD:   {aliases: [XAUUSDm, XAUUSD, GOLD], lots: 0.10, target_usd: 10, rate: slow, pip_size: 0.01, max_spread: 0.300}
    EURUSD:   {aliases: [EURUSDm, EURUSD], lots: 1.0, target_usd: 10, rate: slow, pip_size: 0.0001, max_spread: 0.00020}
    AUDUSD:   {aliases: [AUDUSDm], lots: 1.0, target_usd: 10, rate: slow, pip_size: 0.0001, max_spread: 0.00020}
    GBPJPY:   {aliases: [GBPJPYm], lots: 1.0, target_usd: 10, rate: slow, pip_size: 0.01, max_spread: 0.08}
    GBPUSD:   {aliases: [GBPUSDm, GBPUSD], lots: 1.0, target_usd: 10, rate: slow, pip_size: 0.0001, max_spread: 0.00030}
    USDJPY:   {aliases: [USDJPYm, USDJPY], lots: 1.3, target_usd: 10, rate: slow, pip_size: 0.01, max_spread: 0.025}
    NAS100USD: {broker_symbol: USTEC_x100m, aliases: [NAS100USD, NAS100, US100, USTEC, USTECm, USTEC_x100m], lots: 1, target_usd: 10, rate: slow, pip_size: 1, max_spread: 3.0}
    US30:     {broker_symbol: US30m, aliases: [US30, US30m, 'Wall Street 30', 'US Wall Street 30'], lots: 1, target_usd: 10, rate: slow, pip_size: 1, max_spread: 3.0}
    US500:    {broker_symbol: US500m, aliases: [US500, US500m, SPX500, 'US SPX 500', 'US 500'], lots: 1, target_usd: 10, rate: slow, pip_size: 1, max_spread: 1.0}
    DE40:     {broker_symbol: DE30m, aliases: [DE40, DE40m, DE30, DE30m, GER40, GER30, 'Germany 40', 'Germany 30'], lots: 1, target_usd: 10, rate: slow, pip_size: 1, max_spread: 2.0}
    DE30:     {broker_symbol: DE30m, aliases: [DE30, DE30m, DE40, DE40m, GER40, GER30, 'Germany 40', 'Germany 30'], lots: 1, target_usd: 10, rate: slow, pip_size: 1, max_spread: 2.0}
    JP225:    {broker_symbol: JP225m, aliases: [JP225, JP225m, NIKKEI, 'Japan 225', 'JP 225'], lots: 3, target_usd: 10, rate: slow, pip_size: 1, max_spread: 6.0}
    1HZ100V:   {aliases: [1HZ100V, 'Volatility 100 (1s) Index'], session: continuous, lots: 0.01, target_usd: 10, rate: slow, pip_size: 0.01}
